<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campos de Mistria — Buscador de Recetas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="side-rail" id="side-rail">
    <div class="rail-brand" title="Campos de Mistria">🌸</div>
    <div class="rail-items">
      <button class="rail-btn active" data-page="recipes" title="Recipe Finder" aria-label="Recipe Finder">
        <span class="rail-emoji">🍲</span>
      </button>
      <button class="rail-btn" data-page="gifts" title="Gifts" aria-label="Gifts">
        <span class="rail-emoji">🎁</span>
      </button>
    </div>
    <button id="lang-toggle" class="rail-lang" title="English">EN</button>
  </nav>

  <div class="app-shell">
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark">🍲</div>
          <div>
            <h1 id="site-title">Campos de Mistria <span>Buscador de Recetas</span></h1>
            <p class="tagline" id="site-tagline">Explora todas las recetas de cocina y descubre exactamente qué recetas usan cada ingrediente.</p>
          </div>
        </div>
        <div class="header-right">
          <div class="stats" id="stats"></div>
        </div>
      </div>
    </header>

    <main class="main">
      <section id="page-recipes" class="page wrap">
        <div class="toolbar">
          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input id="search" type="search" placeholder="Busca una receta o ingrediente…" autocomplete="off">
            <button id="clear-search" class="clear-btn" aria-label="Limpiar">×</button>
          </div>
          <div class="toolbar-right">
            <button id="sort-toggle" class="sort-btn" title="Ordenar A-Z">
              <span class="sort-icon">↕</span>
              <span id="sort-label">A-Z</span>
            </button>
            <div class="mode-tabs" role="tablist">
              <button data-mode="recipes" class="tab active" id="tab-recipes">Recetas</button>
              <button data-mode="ingredients" class="tab" id="tab-ingredients">Ingredientes</button>
            </div>
          </div>
        </div>

        <section id="foodlist" class="foodlist"></section>
        <section id="empty" class="empty hidden">
          <p id="empty-msg">No se encontraron recetas.</p>
        </section>
      </section>

      <section id="page-gifts" class="page hidden">
        <div class="gifts-layout">
          <aside class="char-rail" id="char-rail"></aside>
          <div class="char-main">
            <div class="char-head" id="char-head"></div>
            <div class="gift-area">
              <div class="gift-groups" id="gift-groups"></div>
              <aside class="item-detail" id="item-detail"></aside>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p id="footer-text">Datos obtenidos de la <a href="https://fieldsofmistria.wiki.gg/wiki/Cooking" target="_blank" rel="noopener">wiki de Campos de Mistria</a>. Herramienta no oficial de fans.</p>
      </div>
    </footer>
  </div>

  <!-- mobile gift detail modal -->
  <div class="gift-modal-overlay" id="gift-modal-overlay">
    <div class="gift-modal" id="gift-modal">
      <button class="gift-modal-close" id="gift-modal-close" aria-label="Close">\u00d7</button>
      <div class="gift-modal-body" id="gift-modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html
